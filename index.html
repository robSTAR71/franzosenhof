  .btn-secondary:hover{background:#eee3cf;}

  .review-badge{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--border); border-radius:12px; padding:12px 18px;}
  .review-badge:hover{border-color:var(--green);}

  .photo-tile img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s ease;}
  .photo-tile:hover img{transform:scale(var(--hover-scale, 1.05));}

  .lang-btn-compact{padding:8px 10px;}

  .weather-badge{display:flex; align-items:center; gap:6px; padding:6px 10px; border:1px solid var(--border); border-radius:999px; background:var(--cream-card); flex:none; cursor:pointer;}

  .hamburger-bar{width:20px; height:2px; background:var(--ink); border-radius:2px;}

  .mobile-menu-link{color:var(--ink); font-size:17px; font-weight:600; padding:12px 4px; border-bottom:1px solid #e3d7c1; display:block;}

  .submit-btn{margin-top:4px; background:var(--green); color:var(--cream-card); border:none; padding:14px; border-radius:8px; font-weight:600; font-size:15px; cursor:pointer; width:100%;}

  input, textarea{font-family:'Work Sans', sans-serif;}
  input:focus, textarea:focus, button:focus-visible, a:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  function getForecastDays(){

      return { label: label, max: d.max + '°', min: d.min + '°', category: d.category };
    });
  }

      + tt.ausflugstipps.map(function(tip){ return '<li>' + escHtml(tip) + '</li>'; }).join('')
      + '</ul></div>'
      + '<div style="flex:1 1 320px;">'
      + '<h3 style="font-family:\'Lora\',serif;font-size:24px;font-weight:700;margin:0 0 16px;">' + escHtml(tt.formTitle) + '</h3>'
      + '<div id="booking-panel">' + (state.bookingSubmitted ? bookingSuccessHtml() : bookingFormHtml()) + '</div>'
      + '</div></div></div></section>';
  }

  function renderCamping(){
    var tt = t();
    var photos = getPhotos();
    return '<section id="camping" style="padding:clamp(56px,10vw,88px) clamp(20px,6vw,40px);background:var(--cream-alt);">'
      + '<div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;">'
      + '<div style="flex:2 1 400px;">'
      + '<span style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);font-weight:600;">' + escHtml(tt.campingEyebrow) + '</span>'
      + '<div style="width:40px;height:2px;background:var(--brass);margin:10px 0 0;"></div>'
      + '<h2 style="font-family:\'Lora\',serif;font-size:clamp(28px,3.2vw,40px);font-weight:700;margin:12px 0 20px;">' + escHtml(tt.campingTitle) + '</h2>'
      + '<p style="font-size:17px;color:var(--ink-soft);margin:0 0 16px;">' + escHtml(tt.campingP1) + '</p>'
      + '<p style="font-size:17px;color:var(--ink-soft);margin:0 0 28px;">' + escHtml(tt.campingP2) + '</p>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:28px;">'
      + tt.campingFacts.map(function(f){
        return '<div style="background:var(--cream);border:1px solid var(--border-soft);box-shadow:0 3px 12px rgba(44,35,28,0.05);border-radius:12px;padding:18px;">'
          + '<div style="font-size:22px;font-weight:700;color:var(--brass);margin-bottom:4px;">' + escHtml(f.value) + '</div>'
          + '<div style="font-size:14px;color:var(--muted);">' + escHtml(f.label) + '</div></div>';
      }).join('')
      + '</div>'
      + '<h3 style="font-family:\'Lora\',serif;font-size:20px;font-weight:700;margin:0 0 12px;">' + escHtml(tt.ausstattungTitle) + '</h3>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 20px;padding:0;margin:0;">'
      + tt.ausstattung.map(function(item){
        return '<div style="color:var(--ink-soft);font-size:16px;padding-left:16px;position:relative;"><span style="position:absolute;left:0;">–</span>' + escHtml(item) + '</div>';
      }).join('')
      + '</div>'
      + '<p style="font-size:15px;color:var(--muted);margin-top:20px;">' + escHtml(tt.campingNote) + '</p>'
      + '</div>'
      + '<div class="photo-tile" data-idx="' + photos.camping.idx + '" style="--hover-scale:1.05;flex:1 1 260px;aspect-ratio:3/4;border-radius:18px;border:1px solid var(--border-soft);box-shadow:0 10px 30px rgba(44,35,28,0.09);">'
      + '<img src="' + escAttr(photos.camping.src) + '" alt="' + escAttr(photos.camping.label) + '"/>'
      + '</div></div></section>';
  }

  function renderOeffnungszeiten(){
    var tt = t();
    return '<section id="oeffnungszeiten" style="padding:clamp(56px,10vw,88px) clamp(20px,6vw,40px);">'
      + '<div style="max-width:900px;margin:0 auto;text-align:center;">'
      + '<span style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);font-weight:600;">' + escHtml(tt.oeffnungszeitenEyebrow) + '</span>'
      + '<div style="width:40px;height:2px;background:var(--brass);margin:10px auto 0;"></div>'
      + '<h2 style="font-family:\'Lora\',serif;font-size:clamp(28px,3.2vw,40px);font-weight:700;margin:12px 0 32px;">' + escHtml(tt.oeffnungszeitenTitle) + '</h2>'
      + '<div style="background:var(--green);color:var(--cream-card);border-radius:20px;padding:40px;margin-bottom:32px;">'
      + '<div style="font-family:\'Lora\',serif;font-size:28px;font-weight:700;margin-bottom:8px;">' + escHtml(tt.schnitzelTitle) + '</div>'
      + '<div style="font-size:17px;opacity:0.92;">' + escHtml(tt.schnitzelSub) + '</div>'
      + '</div>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;text-align:left;">'
      + '<div style="background:var(--cream-alt);border:1px solid var(--border-soft);box-shadow:0 3px 12px rgba(44,35,28,0.05);border-radius:16px;padding:24px;">'
      + '<div style="font-weight:700;font-size:16px;margin-bottom:8px;">' + escHtml(tt.hoursGuestTitle) + '</div>'
      + '<div style="font-size:15px;color:var(--ink-soft);">' + escHtml(tt.hoursGuestBody) + '</div></div>'
      + '<div style="background:var(--cream-alt);border:1px solid var(--border-soft);box-shadow:0 3px 12px rgba(44,35,28,0.05);border-radius:16px;padding:24px;">'
      + '<div style="font-weight:700;font-size:16px;margin-bottom:8px;">' + escHtml(tt.hoursPubTitle) + '</div>'
      + '<div style="font-size:15px;color:var(--ink-soft);">' + escHtml(tt.hoursPubBody) + '</div></div>'
      + '</div></div></section>';
  }

  function renderKontakt(){
    var tt = t();
    return '<section id="kontakt" style="padding:clamp(56px,10vw,88px) clamp(20px,6vw,40px);background:var(--ink);color:var(--cream);">'
      + '<div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:48px;">'
      + '<div style="flex:1 1 320px;">'
      + '<span style="font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--brass-2);font-weight:600;">' + escHtml(tt.kontaktEyebrow) + '</span>'
      + '<div style="width:40px;height:2px;background:var(--brass-2);margin:10px 0 0;"></div>'
      + '<h2 style="font-family:\'Lora\',serif;font-size:clamp(28px,3.2vw,40px);font-weight:700;margin:12px 0 24px;color:var(--cream);">' + escHtml(tt.kontaktTitle) + '</h2>'
      + '<div style="font-size:18px;line-height:1.8;color:#e6dccb;">'
      + '<div style="font-weight:600;color:var(--cream-card);">Franzosenhof — Gasthaus &amp; Zimmer</div>'
      + '<div>Evelyn Pils</div>'
      + '<div style="margin-top:8px;">Wullowitz 1<br>4262 Leopoldschlag</div>'
      + '<div style="margin-top:16px;">' + escHtml(tt.telLabel) + ' <a href="tel:+4379498284" style="color:var(--brass-2);">+43 7949 8284</a></div>'
      + '<div>' + escHtml(tt.mobilLabel) + ' <a href="tel:+436804016727" style="color:var(--brass-2);">+43 680 40 16 727</a></div>'
      + '<div style="margin-top:8px;">' + escHtml(tt.emailLabel) + ' <a href="mailto:info@franzosenhof.at" style="color:var(--brass-2);">info@franzosenhof.at</a></div>'
      + '</div></div>'
      + '<div style="flex:1 1 320px;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid #4a3f34;">'
      + '<iframe title="Karte Franzosenhof" src="https://www.google.com/maps?q=Wullowitz+1,+4262+Leopoldschlag&output=embed" style="width:100%;height:100%;border:0;display:block;" loading="lazy"></iframe>'
      + '</div></div></section>';
  }

  function renderFooter(){
    var tt = t();
    var links = NAV_HREFS.map(function(href, i){ return '<a href="' + href + '" class="footer-link">' + escHtml(tt.navLabels[i]) + '</a>'; }).join('');
    return '<footer style="padding:24px clamp(20px,6vw,40px);background:#241c16;color:#a4937b;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center;justify-content:space-between;font-size:14px;">'
      + '<span>' + escHtml(tt.footerCopy) + '</span>'
      + '<nav style="display:flex;gap:20px;flex-wrap:wrap;">' + links + '</nav>'
      + '</footer>';
  }

  function renderLightbox(){
    if (state.lightboxIndex === null) return '';
    var photos = getAllPhotos();
    var photo = photos[state.lightboxIndex];
    var counter = (state.lightboxIndex + 1) + ' / ' + photos.length;
    return '<div data-action="close-lightbox" style="position:fixed;inset:0;z-index:100;background:rgba(20,16,12,0.92);display:flex;align-items:center;justify-content:center;padding:clamp(16px,5vw,56px);">'
      + '<button type="button" aria-label="Close" data-action="close-lightbox" class="lightbox-btn" style="position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:999px;font-size:22px;">×</button>'
      + '<button type="button" aria-label="Previous photo" data-action="prev-photo" class="lightbox-btn" style="position:absolute;left:clamp(8px,3vw,32px);top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;font-size:22px;">‹</button>'
      + '<div data-action="stop" style="max-width:min(92vw,1100px);max-height:84vh;display:flex;flex-direction:column;align-items:center;gap:14px;">'
      + '<img src="' + escAttr(photo.src) + '" alt="' + escAttr(photo.label) + '" style="max-width:100%;max-height:74vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.4);"/>'
      + '<div style="color:#e6dccb;font-size:15px;display:flex;gap:14px;align-items:center;">'
      + '<span>' + escHtml(photo.label) + '</span><span style="color:#8a7a68;">·</span><span style="color:#8a7a68;">' + counter + '</span>'
      + '</div></div>'
      + '<button type="button" aria-label="Next photo" data-action="next-photo" class="lightbox-btn" style="position:absolute;right:clamp(8px,3vw,32px);top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;font-size:22px;">›</button>'
      + '</div>';
  }

  var root = document.getElementById('app');

  function render(){
    root.innerHTML = renderHeader() + renderMobileMenu() + renderHero() + renderGasthaus() + renderZimmer() + renderCamping() + renderOeffnungszeiten() + renderKontakt() + renderFooter() + renderLightbox();
    document.documentElement.lang = state.lang === 'cz' ? 'cs' : state.lang;
  }

  // --- actions ---
  function setLang(lang){
    state.lang = validLang(lang);
    try { window.localStorage.setItem('franzosenhof_lang', state.lang); } catch (e) {}
    state.menuOpen = false;
    render();
  }
  function openLightbox(idx){ state.lightboxIndex = idx; render(); }
  function closeLightbox(){ state.lightboxIndex = null; render(); }
  function nextPhoto(){ var n = getAllPhotos().length; state.lightboxIndex = (state.lightboxIndex + 1) % n; render(); }
  function prevPhoto(){ var n = getAllPhotos().length; state.lightboxIndex = (state.lightboxIndex - 1 + n) % n; render(); }

  function resetBooking(){
    bookingData = { vorname: '', nachname: '', anreise: '', abreise: '', email: '', telefon: '', nachricht: '' };
    bookingErrors = {};
    state.bookingSubmitted = false;
    render();
  }

  function submitBooking(){
    var f = bookingData;
    var errors = {};
    if (!f.vorname.trim()) errors.vorname = true;
    if (!f.nachname.trim()) errors.nachname = true;
    if (!f.anreise) errors.anreise = true;
    if (!f.abreise) errors.abreise = true;
    if (!f.email.trim() || !/^\S+@\S+\.\S+$/.test(f.email)) errors.email = true;
    if (!f.telefon.trim()) errors.telefon = true;
    bookingErrors = errors;
    if (Object.keys(errors).length > 0) { render(); return; }

    var bl = t().bookingLabels;
    var subject = bl.subjectPrefix + ' ' + f.vorname + ' ' + f.nachname;
    var bodyLines = [
      bl.vorname + ': ' + f.vorname,
      bl.nachname + ': ' + f.nachname,
      bl.anreise + ': ' + f.anreise,
      bl.abreise + ': ' + f.abreise,
      bl.email + ': ' + f.email,
      bl.telefon + ': ' + f.telefon,
      bl.nachricht + ': ' + (f.nachricht || bl.none),
    ];
    var mailto = 'mailto:info@franzosenhof.at?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyLines.join('\n'));
    window.location.href = mailto;
    bookingErrors = {};
    state.bookingSubmitted = true;
    render();
  }

  function codeToCategory(code){
    if (code === 0) return 'sunny';
    if (code === 1 || code === 2 || code === 3 || code === 45 || code === 48) return 'cloudy';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snowy';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 99)) return 'rainy';
    return 'cloudy';
  }

  function fetchWeather(){
    fetch('https://api.open-meteo.com/v1/forecast?latitude=48.62&longitude=14.62&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3')
      .then(function(r){ return r.json(); })
      .then(function(data){
        var cw = data && data.current_weather;
        if (cw) { state.weather = { temp: Math.round(cw.temperature), category: codeToCategory(cw.weathercode) }; }
        var daily = data && data.daily;
        if (daily && daily.time) {
          state.forecast = daily.time.map(function(date, i){
            return { date: date, category: codeToCategory(daily.weathercode[i]), max: Math.round(daily.temperature_2m_max[i]), min: Math.round(daily.temperature_2m_min[i]) };
          });
        }
        render();
      })
      .catch(function(){});
  }

  // --- global event wiring (delegated; DOM is fully re-rendered on state change) ---
  document.addEventListener('click', function(e){
    var handled = false;
    var langBtn = e.target.closest('[data-lang]');
    if (langBtn) {
      setLang(langBtn.getAttribute('data-lang'));
      handled = true;
    } else {
      var actionEl = e.target.closest('[data-action]');
      if (actionEl) {
        handled = true;
        switch (actionEl.getAttribute('data-action')) {
          case 'toggle-menu': state.menuOpen = !state.menuOpen; render(); break;
          case 'close-menu': state.menuOpen = false; render(); break;
          case 'toggle-forecast': state.forecastOpen = !state.forecastOpen; render(); break;
          case 'close-lightbox': closeLightbox(); break;
          case 'prev-photo': prevPhoto(); break;
          case 'next-photo': nextPhoto(); break;
          case 'reset-booking': resetBooking(); break;
          case 'stop': break;
        }
      } else {
        var tile = e.target.closest('.photo-tile[data-idx]');
        if (tile) { openLightbox(parseInt(tile.getAttribute('data-idx'), 10)); handled = true; }
      }
    }
    if (!handled && state.forecastOpen && !e.target.closest('[data-weather-widget]')) {
      state.forecastOpen = false;
      render();
    }
  });

  document.addEventListener('submit', function(e){
    if (e.target && e.target.id === 'booking-form') {
      e.preventDefault();
      submitBooking();
    }
  });

  document.addEventListener('input', function(e){
    var field = e.target.getAttribute && e.target.getAttribute('data-field');
    if (field) { bookingData[field] = e.target.value; }
  });

  document.addEventListener('keydown', function(e){
    if (state.lightboxIndex === null) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextPhoto();
    if (e.key === 'ArrowLeft') prevPhoto();
  });

  window.addEventListener('resize', function(){
    var isMobile = window.innerWidth < 1420;
    var isNarrow = window.innerWidth < 560;
    if (isMobile !== state.isMobile || isNarrow !== state.isNarrow) {
      state.isMobile = isMobile;
      state.isNarrow = isNarrow;
      state.menuOpen = false;
      render();
    }
  });

  render();
  fetchWeather();
})();
</script>
</body>
</html>
